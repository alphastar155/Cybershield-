<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN | CyberShield Security</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #0a0f1c; color: white; display: flex; flex-direction: column; min-height: 100vh; }
        #header { width: 100%; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 40px; box-sizing: border-box; border-bottom: 2px dashed #00ffcc; background: #111a2b; }
        #header h1 { margin: 0; color: #00ffcc; font-size: 2.5rem; letter-spacing: 2px; text-shadow: 2px 2px 10px rgba(0,255,204,0.3); }
        #header p { margin: 5px 0 0; color: #fff; font-style: italic; }
        .content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .box { background: #111a2b; padding: 40px; width: 100%; max-width: 400px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(0,255,204,0.2); }
        .box h2 { color: #00ffcc; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 3px; }
        .box input[type="text"], .box input[type="password"] { width: 100%; padding: 12px; margin-bottom: 20px; background: rgba(10,15,28,0.8); border: 1px solid #00ffcc; border-radius: 5px; color: white; outline: none; box-sizing: border-box; transition: 0.3s; }
        .box input:focus { box-shadow: 0 0 10px rgba(0,255,204,0.5); background: rgba(0,255,204,0.05); }
        .box button { width: 100%; padding: 12px; background: #00ffcc; border: none; border-radius: 5px; color: #0a0f1c; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; }
        .box button:hover { background: #00e6b8; box-shadow: 0 0 20px rgba(0,255,204,0.4); transform: scale(1.02); }
        .links { margin-top: 20px; font-size: 0.85rem; }
        .links a { color: #00ffcc; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .error-msg { background: rgba(255,50,50,0.1); border: 1px solid red; color: #ff6666; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        footer { padding: 20px; background: #111a2b; border-top: 2px dashed #00ffcc; color: #00ffcc; text-align: center; }
    </style>
</head>
<body>

<header id="header">
    <h1>CYBERSHEILD SECURITY</h1>
    <p>Protecting Your Digital World</p>
</header>

<div class="content">
    <form class="box" method="POST">
        {% csrf_token %}
        <h2>Portal Login</h2>

        {% if error %}
            <p class="error-msg">❌ {{ error }}</p>
        {% endif %}

        <input type="text" name="username" placeholder="Username / Admin ID" required>
        <input type="password" name="password" placeholder="Access Password" required>
        <button type="submit">Authorize Access</button>

        <div class="links">
            <a href="{% url 'register' %}">Create Account</a> |
            <a href="#">Forgot Password?</a>
        </div>
    </form>
</div>

<footer>
    <p>&copy; 2026 CyberShield Security. All Rights Reserved.</p>
</footer>

</body>
</html>
